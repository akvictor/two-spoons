*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{

/* ================= state ================= */
const KEY="twospoons_v1";
const MEALS=["Breakfast","Lunch","Dinner","Snacks"];
const ACT={sedentary:1.2,light:1.375,moderate:1.55,active:1.725};
const PACE={maintain:0,lose025:-275,lose05:-550,gain025:275};
/* Storage tiers, best first. Sandboxed hosts block some but rarely all;
   whichever survives the probe is the one every save goes through. */
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej();
    let rq;try{rq=indexedDB.open("twospoons",1);}catch(e){return rej();}
    rq.onupgradeneeded=()=>{rq.result.createObjectStore("kv");};
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(); rq.onblocked=()=>rej();
    setTimeout(rej,2500);
  });
}
function idbReq(db,mode,fn){
  return new Promise((res,rej)=>{
    let tx;try{tx=db.transaction("kv",mode);}catch(e){return rej();}
    const rq=fn(tx.objectStore("kv"));
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej();
  });
}
const Store={
  tier:"memory", mem:null, db:null,
  async init(){
    try{localStorage.setItem("__t","1");localStorage.removeItem("__t");this.tier="local";return;}catch(e){}
    try{this.db=await idbOpen();await idbReq(this.db,"readwrite",s=>s.put(1,"__t"));this.tier="idb";return;}catch(e){}
    this.tier="memory";
  },
  async load(){
    if(this.tier==="local"){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
    if(this.tier==="idb"){try{return await idbReq(this.db,"readonly",s=>s.get(KEY))||null;}catch(e){return null;}}
    return this.mem;
  },
  save(state){
    if(this.tier==="local"){
      try{localStorage.setItem(KEY,JSON.stringify(state));return;}catch(e){this.tier="memory";}
    }
    if(this.tier==="idb"){
      this.mem=state;
      idbReq(this.db,"readwrite",s=>s.put(JSON.parse(JSON.stringify(state)),KEY)).catch(()=>{this.tier="memory";});
      return;
    }
    this.mem=state;
  },
  saving(){return this.tier!=="memory";},
  where(){return this.tier==="local"?"this device":this.tier==="idb"?"this device (browser database)":"backup files only";}
};
function persist(){S.dirtyAt=Date.now();Store.save(S);}
/* memory-only: nothing on disk, so don't let a stray tab close eat the day */
window.addEventListener("beforeunload",e=>{
  if(Store.saving())return;
  if(!S.dirtyAt||(S.backedUpAt&&S.backedUpAt>=S.dirtyAt))return;
  e.preventDefault();e.returnValue="";
});
function blank(){
  return {v:1,setup:false,active:"a",tab:"today",date:todayStr(),
    profiles:{a:{id:"a",name:"",sex:"male",age:32,height:172,weight:70,activity:"light",pace:"lose025",override:null},
              b:{id:"b",name:"",sex:"female",age:32,height:160,weight:55,activity:"light",pace:"lose025",override:null}},
    logs:{a:{},b:{}}, weights:{a:[],b:[]}, custom:[], recents:{a:[],b:[]}};
}
let S=blank();
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2,8));}
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(ds,n){const p=ds.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return todayStr(d);}
function niceDate(ds){const p=ds.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);
  if(ds===todayStr())return "Today";
  if(ds===addDays(todayStr(),-1))return "Yesterday";
  return d.toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"});}
function r0(n){return Math.round(n);}
function budget(p){
  if(p.override) return p.override;
  const w=latestWeight(p.id)||p.weight;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="male"?5:-161);
  return Math.max(1200,r0(bmr*ACT[p.activity]+PACE[p.pace]));
}
function latestWeight(pid){const ws=S.weights[pid];return ws&&ws.length?ws[ws.length-1].kg:null;}
function entries(pid,date){return (S.logs[pid][date])||[];}
function dayKcal(pid,date){return entries(pid,date).reduce((a,e)=>a+e.kcal*e.qty,0);}
function dayMacro(pid,date,k){return entries(pid,date).reduce((a,e)=>a+(e[k]||0)*e.qty,0);}
function prof(){return S.profiles[S.active];}
function other(){return S.profiles[S.active==="a"?"b":"a"];}
function colorOf(pid){return pid==="a"?"var(--p1)":"var(--p2)";}
function streak(pid){
  let n=0,d=todayStr();
  if(!entries(pid,d).length) d=addDays(d,-1);
  while(entries(pid,d).length){n++;d=addDays(d,-1);}
  return n;
}

   '<circle class="ringprog" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(over?"var(--over)":color)+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-frac)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
   '<text x="50%" y="46%" text-anchor="middle" font-size="'+size*0.2+'" font-weight="800" fill="var(--ink)" class="num">'+r0(eaten)+'</text>'+
   '<text x="50%" y="62%" text-anchor="middle" font-size="'+size*0.085+'" fill="var(--ink3)">of '+bud+' kcal</text></svg>';

function searchFoods(q,limit){
  const fs=allFoods();
  if(!q) return fs.slice(0,limit);
  const ql=q.toLowerCase().trim();
  const toks=ql.split(/\s+/).filter(Boolean);
  return fs.map(f=>{
    const hay=(f.name+" "+(f.kw||"")).toLowerCase();
    const words=hay.split(/[^a-z0-9]+/);
    let sc=0;
    for(const t of toks){
      if(words.includes(t))sc+=t.length*2;
      else if(hay.includes(t))sc+=t.length;
    }
    if(f.name.toLowerCase()===ql)sc+=100;
    else if(f.name.toLowerCase().startsWith(ql))sc+=10;
    return [sc,f];
  }).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,limit).map(x=>x[1]);
}

/* quick log parser */
function parseQuick(text){
  const parts=text.split(/[+,]| and /i).map(s=>s.trim()).filter(Boolean);
  return parts.map(part=>{
    let qty=1, q=part.toLowerCase();
    const m=q.match(/^(\d+(?:\.\d+)?|half|quarter)\s*(?:x|×)?\s+/);
    if(m){qty=m[1]==="half"?0.5:m[1]==="quarter"?0.25:parseFloat(m[1]);q=q.slice(m[0].length);}
    if(!(qty>0)||qty>10)qty=1;
    if(/^half /.test(part.toLowerCase())){qty=0.5;}
    const hits=searchFoods(q,1);
    const food=hits[0]||null;
    /* "2 soft boiled eggs" vs a serving already sized "2 eggs": collapse to 1× */
    if(food&&qty!==1){
      const sm=String(food.serving).match(/^(\d+(?:\.\d+)?)/);
      if(sm&&parseFloat(sm[1])===qty)qty=1;
    }
    return {raw:part,qty:qty,food:food};
  });
}

/* ================= charts ================= */
function barChart(days,series,bud){ /* series: [{pid,color,vals[]}] one or two */
  const W=488,H=170,padL=6,padB=18,padT=14;
  const maxV=Math.max(bud||0,...series.flatMap(s=>s.vals))*1.08||100;
  const n=days.length, slot=(W-padL)/n, bw=series.length===2?Math.min(14,slot/2-3):Math.min(22,slot-4);
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  /* gridline at budget */
  if(bud){svg+='<line x1="0" x2="'+W+'" y1="'+y(bud)+'" y2="'+y(bud)+'" stroke="var(--ink3)" stroke-dasharray="4 4" stroke-width="1"/>'+
    '<text x="'+(W-2)+'" y="'+(y(bud)-4)+'" text-anchor="end" font-size="10" fill="var(--ink3)" class="num">budget '+bud+'</text>';}
  days.forEach((d,i)=>{
    const cx=padL+slot*i+slot/2;
    series.forEach((s,si)=>{
      const v=s.vals[i]; if(v<=0)return;
      const x=series.length===2?cx-bw-1+(si*(bw+2)):cx-bw/2;
      const h=Math.max(2,(H-padT-padB)*v/maxV);
      svg+='<rect x="'+x+'" y="'+y(v)+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+s.color+'" data-tip="'+niceDate(d)+" · "+r0(v)+' kcal"/>';
      /* square off bottom corners: overlay */
      svg+='<rect x="'+x+'" y="'+(H-padB-Math.min(4,h))+'" width="'+bw+'" height="'+Math.min(4,h)+'" fill="'+s.color+'"/>';
    });
    const lab=d.slice(8);
    if(n<=14||i%2===0)svg+='<text x="'+cx+'" y="'+(H-4)+'" text-anchor="middle" font-size="9.5" fill="var(--ink3)" class="num">'+(+lab)+'</text>';
  });
  svg+='<line x1="0" x2="'+W+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--line)"/></svg>';
  return '<div class="chart">'+svg+'</div>';
}
function lineChart(pts,color,unit){ /* pts=[{d,v}] sorted */
  if(pts.length<2)return '<p class="tiny muted">Log at least two entries to see the trend.</p>';
  const W=488,H=150,padL=6,padR=40,padT=12,padB=16;
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi-lo<2){lo-=1;hi+=1;} const span=hi-lo; lo-=span*0.15; hi+=span*0.15;
  const t0=new Date(pts[0].d).getTime(),t1=new Date(pts[pts.length-1].d).getTime()||t0+1;
  const x=d=>padL+(W-padL-padR)*((new Date(d).getTime()-t0)/Math.max(1,t1-t0));
  const y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
  let path=pts.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">'+
   '<line x1="0" x2="'+W+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--line)"/>'+
   '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  for(const p of pts){svg+='<circle cx="'+x(p.d)+'" cy="'+y(p.v)+'" r="4" fill="'+color+'" stroke="var(--card)" stroke-width="2" data-tip="'+niceDate(p.d)+" · "+p.v+" "+unit+'"/>';}
  svg+='<circle cx="'+x(last.d)+'" cy="'+y(last.v)+'" r="5" fill="'+color+'" stroke="var(--card)" stroke-width="2"/>'+
   '<text x="'+(x(last.d)+8)+'" y="'+(y(last.v)+4)+'" font-size="11" font-weight="700" fill="var(--ink)" class="num">'+last.v+'</text></svg>';
  return '<div class="chart">'+svg+'</div>';
}

    '</section>';
  return html;

    const bud=budget(p),eaten=dayKcal(p.id,todayStr()),left=bud-eaten;
    html+='<div class="uscard '+(p.id==="a"?"c1":"c2")+'"><div style="font-weight:700">'+esc(p.name)+'</div>'+
     '<div style="font-size:24px;font-weight:800;margin:4px 0" class="num">'+r0(eaten)+'<span class="tiny muted" style="font-weight:600"> / '+bud+'</span></div>'+
     '<span class="pill '+(left>=0?"good":"over")+'">'+(left>=0?r0(left)+" left":r0(-left)+" over")+'</span>'+
     '<div class="tiny muted" style="margin-top:8px">🔥 <span class="num">'+streak(p.id)+'</span>-day streak</div></div>';
  }
  html+='</div>';
  const bothToday=dayKcal("a",todayStr())>0&&dayKcal("b",todayStr())>0;
  const bothUnder=bothToday&&dayKcal("a",todayStr())<=budget(a)&&dayKcal("b",todayStr())<=budget(b);
  if(bothUnder)html+='<p class="tiny" style="text-align:center;margin:10px 0;color:var(--good);font-weight:600">Both under budget today 🎉</p>';
  html+='<section class="card" style="margin-top:14px"><div class="label" style="margin-bottom:4px">This week</div>'+
   '<div class="legend"><span class="li"><span class="sw" style="background:var(--p1)"></span>'+esc(a.name)+'</span><span class="li"><span class="sw" style="background:var(--p2)"></span>'+esc(b.name)+'</span></div>'+
   barChart(days,[{pid:"a",color:"var(--p1)",vals:days.map(d=>dayKcal("a",d))},{pid:"b",color:"var(--p2)",vals:days.map(d=>dayKcal("b",d))}],0)+
   '<details class="dtable"><summary>View as table</summary><table class="data"><tr><th>Day</th><th>'+esc(a.name)+'</th><th>'+esc(b.name)+'</th></tr>'+
   days.map(d=>'<tr><td>'+niceDate(d)+'</td><td class="num">'+r0(dayKcal("a",d))+'</td><td class="num">'+r0(dayKcal("b",d))+'</td></tr>').join("")+'</table></details></section>';
  const wa=S.weights.a.slice(-60),wb=S.weights.b.slice(-60);
  if(wa.length>=2||wb.length>=2){
    html+='<section class="card"><div class="label" style="margin-bottom:4px">Weight trends</div>';
    if(wa.length>=2)html+='<div class="tiny muted">'+esc(a.name)+'</div>'+lineChart(wa.map(w=>({d:w.d,v:w.kg})),"var(--p1)","kg");
    if(wb.length>=2)html+='<div class="tiny muted" style="margin-top:8px">'+esc(b.name)+'</div>'+lineChart(wb.map(w=>({d:w.d,v:w.kg})),"var(--p2)","kg");
    html+='</section>';
  }
  html+='<p class="tiny muted" style="text-align:center;margin:16px 0">Logging on separate phones? Sync via Settings → Export / Import.</p>';
  return html;
}
/* ================= Settings ================= */

    html+='<section class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+colorOf(pid)+';margin-right:6px"></span>'+esc(p.name)+'</b><span class="tiny muted num">budget '+budget(p)+' kcal</span></div>'+
    '<button class="btn small" data-act="editprof" data-pid="'+pid+'">Edit profile & goal</button></section>';
  }
  html+='<section class="card"><div class="label" style="margin-bottom:8px">Saving</div>'+
   '<div class="row" style="justify-content:space-between"><span class="tiny">Kept in <b>'+Store.where()+'</b></span>'+
   '<span class="pill '+(Store.saving()?"good":"over")+'">'+(Store.saving()?"Saving on":"Not saving")+'</span></div>'+
   (Store.saving()?"":'<p class="tiny muted" style="margin:10px 0 0">Keep a backup file and restore it when you come back, or open the app file directly where saving works normally.</p>')+

   '<p class="tiny muted" style="margin:0">Food values are typical estimates (SG hawker portions where relevant) — treat them as a guide, not gospel. Budgets use the Mifflin-St Jeor formula. Not medical advice.</p>'+

function editProfSheet(pid){
  const p=S.profiles[pid];
  openSheet('<h3>'+esc(p.name||"Profile")+'</h3>'+profFormHTML("s_",p)+
   '<div class="frow"><div><div class="flabel">Budget override (kcal, blank = auto)</div><input id="s_ov" type="number" value="'+(p.override||"")+'"></div></div>'+

  $("#profSave").onclick=()=>{
    readProfForm("s_",p);

function profFormHTML(pre,p){

   '<div><div class="flabel">Sex</div><select id="'+pre+'sex"><option value="male" '+(p.sex==="male"?"selected":"")+'>Male</option><option value="female" '+(p.sex==="female"?"selected":"")+'>Female</option></select></div></div>'+

   '<div><div class="flabel">Height cm</div><input id="'+pre+'h" type="number" value="'+p.height+'"></div>'+
   '<div><div class="flabel">Weight kg</div><input id="'+pre+'w" type="number" step="0.1" value="'+p.weight+'"></div></div>'+
   '<div class="frow"><div><div class="flabel">Activity</div><select id="'+pre+'act">'+
     '<option value="sedentary" '+(p.activity==="sedentary"?"selected":"")+'>Sedentary (desk job)</option>'+
     '<option value="light" '+(p.activity==="light"?"selected":"")+'>Light (walks, 1–2 workouts/wk)</option>'+
     '<option value="moderate" '+(p.activity==="moderate"?"selected":"")+'>Moderate (3–5 workouts/wk)</option>'+
     '<option value="active" '+(p.activity==="active"?"selected":"")+'>Very active</option></select></div>'+
   '<div><div class="flabel">Goal</div><select id="'+pre+'pace">'+
     '<option value="lose05" '+(p.pace==="lose05"?"selected":"")+'>Lose 0.5 kg/week</option>'+
     '<option value="lose025" '+(p.pace==="lose025"?"selected":"")+'>Lose 0.25 kg/week</option>'+
     '<option value="maintain" '+(p.pace==="maintain"?"selected":"")+'>Maintain</option>'+
     '<option value="gain025" '+(p.pace==="gain025"?"selected":"")+'>Gain 0.25 kg/week</option></select></div></div>';
}
function readProfForm(pre,p){
  p.name=$("#"+pre+"name").value.trim()||p.name;
  p.sex=$("#"+pre+"sex").value; p.age=+$("#"+pre+"age").value||p.age;
  p.height=+$("#"+pre+"h").value||p.height; p.weight=+$("#"+pre+"w").value||p.weight;
  p.activity=$("#"+pre+"act").value; p.pace=$("#"+pre+"pace").value;
}
/* export / import */
function backupJSON(){return JSON.stringify({app:"twospoons",exportedAt:new Date().toISOString(),state:S});}
function backupName(){return "twospoons-"+todayStr()+".json";}
async function downloadBackup(){
  const json=backupJSON(), fn=backupName();
  if(window.claude&&typeof claude.use==="function"){
    try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:fn,data:json});S.backedUpAt=Date.now();persist();return true;}}catch(e){}
  }
  try{
    const b=new Blob([json],{type:"application/json"});const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    S.backedUpAt=Date.now();persist();
    return true;
  }catch(e){return false;}
}
function doExport(){
  const json=backupJSON();
  const out=$("#exportOut");
  out.innerHTML='<textarea rows="3" readonly id="expTxt" style="margin-top:10px;font-size:11px">'+esc(json)+'</textarea>'+
   '<div class="row" style="margin-top:8px"><button class="btn small grow" id="expCopy">Copy to clipboard</button><button class="btn small grow" id="expDl">Download file</button></div>';
  $("#expCopy").onclick=async()=>{try{await navigator.clipboard.writeText(json);$("#expCopy").textContent="Copied ✓";}catch(e){$("#expTxt").select();document.execCommand("copy");$("#expCopy").textContent="Copied ✓";}};
  $("#expDl").onclick=async()=>{
    const ok=await downloadBackup();
    $("#expDl").textContent=ok?"Saved ✓":"Download blocked — copy instead";
  };
}
function doImport(){
  openSheet('<h3>Import data</h3><p class="tiny muted" style="margin-top:-6px">Paste an export from the other phone, or choose the file.</p>'+
   '<textarea id="impTxt" rows="4" placeholder="Paste exported data here"></textarea>'+
   '<input type="file" id="impFile" accept=".json" style="margin-top:10px">'+
   '<div class="row" style="margin-top:12px"><button class="btn primary grow" id="impMerge">Merge into this phone</button></div>'+
   '<p class="tiny muted">Merging combines both phones\' entries and weights. Profiles and settings on this phone are kept.</p>');
  $("#impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#impTxt").value=r.result;};r.readAsText(f);};
  $("#impMerge").onclick=()=>{
    let obj;try{obj=JSON.parse($("#impTxt").value);}catch(e){alert("That doesn't look like a valid export.");return;}
    const st=obj.state||obj;
    if(!st.logs||!st.profiles){alert("That doesn't look like a Two Spoons export.");return;}
    for(const pid of ["a","b"]){
      const inLogs=st.logs[pid]||{};
      for(const d in inLogs){
        const cur=S.logs[pid][d]||(S.logs[pid][d]=[]);
        for(const e of inLogs[d]){if(!cur.some(x=>x.id===e.id))cur.push(e);}
      }
      const seen={};for(const w of S.weights[pid])seen[w.d]=w;
      for(const w of (st.weights&&st.weights[pid])||[]){if(!seen[w.d])S.weights[pid].push(w);}
      S.weights[pid].sort((x,y)=>x.d<y.d?-1:1);
    }
    for(const c of st.custom||[]){if(!S.custom.some(x=>x.name===c.name))S.custom.push(c);}
    persist();closeSheet();render();
    alert("Merged ✓");
  };
}
/* ================= Setup ================= */
function setupHTML(){
  return '<div style="padding:28px 0 10px;text-align:center"><div style="font-size:44px">🥄🥄</div><h1 style="font-size:26px;letter-spacing:-.02em">Two Spoons</h1>'+
   '<p class="muted" style="margin:6px 0 0;font-size:14.5px">Calorie tracking for the two of you.</p></div>'+
   '<section class="card"><div class="label" style="margin-bottom:10px;color:var(--p1)">You</div>'+profFormHTML("a_",S.profiles.a)+'</section>'+
   '<section class="card"><div class="label" style="margin-bottom:10px;color:var(--p2)">Your partner</div>'+profFormHTML("b_",S.profiles.b)+'</section>'+
   '<button class="btn primary" style="width:100%;margin-bottom:30px" id="setupGo">Start tracking</button>';
}
function bindSetup(){
  $("#a_name").placeholder="Your name"; $("#b_name").placeholder="Their name";
  $("#setupGo").onclick=()=>{
    readProfForm("a_",S.profiles.a); readProfForm("b_",S.profiles.b);
    if(!S.profiles.a.name)S.profiles.a.name="Me";
    if(!S.profiles.b.name)S.profiles.b.name="Partner";
    S.setup=true; persist(); render();
  };
}
/* ================= events ================= */
function bindMain(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick=()=>{
      const a=el.dataset.act;
      if(a==="tab"){S.tab=el.dataset.tab;render();}
      else if(a==="who"){S.active=el.dataset.pid;persist();render();}
      else if(a==="prevday"){S.date=addDays(S.date,-1);render();}
      else if(a==="nextday"){if(S.date<todayStr()){S.date=addDays(S.date,1);render();}}
      else if(a==="gotoday"){S.date=todayStr();render();}
      else if(a==="add"){openAdd(el.dataset.meal);}
      else if(a==="edit"){openEdit(el.dataset.id);}
      else if(a==="copyday"){
        const y=entries(S.active,addDays(S.date,-1));
        S.logs[S.active][S.date]=y.map(e=>Object.assign({},e,{id:uid(),ts:Date.now()}));
        persist();render();
      }
      else if(a==="logweight"){
        const v=parseFloat($("#wIn").value);
        if(!(v>20&&v<300)){alert("Enter a weight in kg.");return;}
        const ws=S.weights[S.active].filter(w=>w.d!==todayStr());
        ws.push({d:todayStr(),kg:v});ws.sort((x,y)=>x.d<y.d?-1:1);
        S.weights[S.active]=ws; prof().weight=v; persist();render();
      }
      else if(a==="editprof"){editProfSheet(el.dataset.pid);}
      else if(a==="backupnow"){downloadBackup().then(ok=>{if(!ok){S.tab="settings";render();doExport();}});}
      else if(a==="export"){doExport();}
      else if(a==="import"){doImport();}
      else if(a==="reset"){if(confirm("Erase ALL data for both of you on this phone?")){S=blank();persist();render();}}
    };
  });
  /* chart tooltips */
  const tip=$("#tip");
  document.querySelectorAll("[data-tip]").forEach(el=>{
    const show=ev=>{tip.textContent=el.dataset.tip;tip.style.display="block";
      const x=(ev.touches?ev.touches[0].clientX:ev.clientX),y=(ev.touches?ev.touches[0].clientY:ev.clientY);
      tip.style.left=Math.min(window.innerWidth-150,x+10)+"px";tip.style.top=(y-36)+"px";};
    el.addEventListener("mouseenter",show);el.addEventListener("mousemove",show);
    el.addEventListener("mouseleave",()=>tip.style.display="none");
    el.addEventListener("touchstart",ev=>{show(ev);setTimeout(()=>tip.style.display="none",1600);},{passive:true});
  });
}
function bindAddSheet(){
  $("#mealSel").onchange=e=>{sheetMeal=e.target.value;};
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{sheetTab=b.dataset.st;pickedFood=null;refreshSheet();});
  bindSheetBody();
}
function refreshSheet(){
  const sb=$("#sheetBody");if(!sb)return;
  document.querySelectorAll("[data-st]").forEach(b=>b.classList.toggle("on",b.dataset.st===sheetTab));
  sb.innerHTML=sheetBodyHTML();bindSheetBody();
}
function bindSheetBody(){
  const q=$("#foodQ");
  if(q){q.oninput=()=>{$("#foodList").innerHTML=foodListHTML(q.value.trim());bindFoodRows();};bindFoodRows();
    if(!("ontouchstart" in window))q.focus();}
  if($("#pickAdd")){
    const upd=()=>{$("#qVal").textContent=pickedQty+"×";$("#qKcal").textContent=r0(pickedFood.kcal*pickedQty)+" kcal";};
    $("#qMinus").onclick=()=>{pickedQty=Math.max(0.25,+(pickedQty-0.25).toFixed(2));upd();};
    $("#qPlus").onclick=()=>{pickedQty=+(pickedQty+0.25).toFixed(2);upd();};
    $("#pickBack").onclick=()=>{pickedFood=null;refreshSheet();};
    $("#pickAdd").onclick=()=>{addEntry(pickedFood,pickedQty,sheetMeal);closeSheet();render();};
  }
  if($("#quickGo")){
    $("#quickGo").onclick=()=>{
      const t=$("#quickQ").value.trim();if(!t)return;
      quickParsed=parseQuick(t);$("#quickOut").innerHTML=quickOutHTML();
      const ba=$("#quickAdd");if(ba)ba.onclick=()=>{
        for(const it of quickParsed){if(it.food)addEntry(it.food,it.qty,sheetMeal);}
        closeSheet();render();
      };
    };
  }
  if($("#cSave")){
    $("#cSave").onclick=()=>{
      const name=$("#cName").value.trim(),k=+$("#cK").value;
      if(!name||!(k>0)){alert("Give it a name and calories.");return;}
      const f={name:name,serving:$("#cServ").value.trim()||"1 serving",kcal:r0(k),p:+$("#cP").value||0,c:+$("#cC").value||0,f:+$("#cF").value||0,kw:""};
      if(!S.custom.some(x=>x.name===f.name))S.custom.unshift(f);
      addEntry(f,1,sheetMeal);closeSheet();render();
    };
  }
}
function bindFoodRows(){
  document.querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>{
    pickedFood=allFoods().find(f=>f.name===b.dataset.food);pickedQty=1;refreshSheet();
  });
}
(async function boot(){
  await Store.init();
  const saved=await Store.load();
  if(saved&&saved.profiles&&saved.logs)S=saved;
  S.tab="today"; S.date=todayStr();
  for(const pid of ["a","b"]){S.logs[pid]=S.logs[pid]||{};S.weights[pid]=S.weights[pid]||[];S.recents[pid]=S.recents[pid]||[];}
  S.custom=S.custom||[];
  render();
})();
</script>
