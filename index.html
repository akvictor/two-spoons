<title>Two Spoons</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16201D">
<style>
/* ---------- design tokens ----------
   Two independent axes: data-style sets the personality (shape, type,
   surfaces), data-theme sets light/dark. The two partner colours stay the same
   in every style — they are the chart series and are colour-vision validated
   against each surface. */
:root{
  /* shape + type, overridden per style */
  --bw:2.5px; --bw-s:2px; --rad:22px; --rad-s:16px; --rad-xs:13px;
  --press:3px; --shadow:0 3px 0 var(--line); --shadow-s:0 2.5px 0 var(--line);
  --font:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Quicksand,Nunito,
         -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --wt:750; --wt-h:800;
  /* the two people — identical across every style */
  --p1:#3565C0; --p1-soft:#E5EDFB; --p2:#C06722; --p2-soft:#F9EDE1;
  --good:#2E7D4F; --good-soft:#E3F1E8; --over:#C03A2E; --over-soft:#F9E6E4;
  --burn:#7A5AA8; --burn-soft:#EFE8F7; --water:#2E7B93; --water-soft:#E1F0F4;
  /* macros — validated as a categorical trio on every surface */
  --pro:#0D9488; --carb:#CA8A04; --fat:#7E22CE;
  /* surfaces — sticker, light */
  --bg:#FFF6E9; --card:#FFFFFF; --ink:#2B2622; --ink2:#6B675E; --ink3:#9C968C;
  --line:#2B2622; --line2:#F3EADC; --edge:#E3D6C2; --ring-track:#F0E4D2;
  --sheet-scrim:rgba(43,38,34,.45);
}
/* ---- style: clean ---- */
:root[data-style="clean"]{
  --bw:1px; --bw-s:1px; --rad:14px; --rad-s:10px; --rad-xs:9px;
  --press:0px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.05);
  --shadow-s:none; --wt:600; --wt-h:700;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#111827; --ink2:#5B6472; --ink3:#98A0AE;
  --line:#E3E7ED; --line2:#F1F3F6; --edge:#E3E7ED; --ring-track:#EBEEF2;
  --sheet-scrim:rgba(17,24,39,.4);
}
/* ---- style: blossom ---- */
:root[data-style="blossom"]{
  --bw:2px; --bw-s:1.5px; --rad:26px; --rad-s:20px; --rad-xs:16px;
  --press:2px; --shadow:0 3px 0 var(--edge); --shadow-s:0 2px 0 var(--edge);
  --wt:700; --wt-h:800;
  --bg:#FDF4F7; --card:#FFFFFF; --ink:#3B2B36; --ink2:#7A6470; --ink3:#AE9BA6;
  --line:#EBD3DE; --line2:#F8EBF1; --edge:#EBD3DE; --ring-track:#F5E2EA;
  --sheet-scrim:rgba(59,43,54,.38);
}
/* ---- style: ink ---- */
:root[data-style="ink"]{
  --bw:1.5px; --bw-s:1.5px; --rad:6px; --rad-s:5px; --rad-xs:4px;
  --press:0px; --shadow:none; --shadow-s:none; --wt:650; --wt-h:800;
  --font:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#0D0D0F; --ink2:#4A4A52; --ink3:#8A8A94;
  --line:#0D0D0F; --line2:#EDEDF0; --edge:#0D0D0F; --ring-track:#EDEDF0;
  --sheet-scrim:rgba(13,13,15,.5);
}
/* ---- dark surfaces, per style ---- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141F1C; --card:#20302B; --ink:#F2EFE7; --ink2:#A9B0AA; --ink3:#7B837D;
    --line:#0C1512; --line2:#2A3A34; --edge:#0C1512; --ring-track:#2A3A34;
    --p1:#5B87DF; --p1-soft:#233046; --p2:#CE7429; --p2-soft:#3A2C1C;
    --good:#5CB884; --good-soft:#1F3529; --over:#E06B5F; --over-soft:#3E2523;
    --burn:#A98CD8; --burn-soft:#2B2440; --water:#5FAFC4; --water-soft:#1B3138;
    --pro:#149C8A; --carb:#B58510; --fat:#8F5FD0;
    --sheet-scrim:rgba(0,0,0,.6);
  }
  :root[data-style="clean"]:not([data-theme="light"]){
    --bg:#15181C; --card:#1D2126; --ink:#F0F2F5; --ink2:#A3ACB9; --ink3:#727B88;
    --line:#2A2F36; --line2:#232830; --edge:#2A2F36; --ring-track:#2A2F36;
  }
  :root[data-style="blossom"]:not([data-theme="light"]){
    --bg:#1C1620; --card:#271E2C; --ink:#F5EDF2; --ink2:#B7A4B2; --ink3:#8A7686;
    --line:#3A2C3F; --line2:#312536; --edge:#3A2C3F; --ring-track:#3A2C3F;
  }
  :root[data-style="ink"]:not([data-theme="light"]){
    --bg:#0D0D0F; --card:#0D0D0F; --ink:#F4F4F6; --ink2:#A0A0AA; --ink3:#71717C;
    --line:#F4F4F6; --line2:#26262B; --edge:#F4F4F6; --ring-track:#26262B;
  }
}
:root[data-theme="dark"]{
  --bg:#141F1C; --card:#20302B; --ink:#F2EFE7; --ink2:#A9B0AA; --ink3:#7B837D;
  --line:#0C1512; --line2:#2A3A34; --edge:#0C1512; --ring-track:#2A3A34;
  --p1:#5B87DF; --p1-soft:#233046; --p2:#CE7429; --p2-soft:#3A2C1C;
  --good:#5CB884; --good-soft:#1F3529; --over:#E06B5F; --over-soft:#3E2523;
  --burn:#A98CD8; --burn-soft:#2B2440; --water:#5FAFC4; --water-soft:#1B3138;
  --pro:#149C8A; --carb:#B58510; --fat:#8F5FD0;
  --sheet-scrim:rgba(0,0,0,.6);
}
:root[data-theme="dark"][data-style="clean"]{
  --bg:#15181C; --card:#1D2126; --ink:#F0F2F5; --ink2:#A3ACB9; --ink3:#727B88;
  --line:#2A2F36; --line2:#232830; --edge:#2A2F36; --ring-track:#2A2F36;
}
:root[data-theme="dark"][data-style="blossom"]{
  --bg:#1C1620; --card:#271E2C; --ink:#F5EDF2; --ink2:#B7A4B2; --ink3:#8A7686;
  --line:#3A2C3F; --line2:#312536; --edge:#3A2C3F; --ring-track:#3A2C3F;
}
:root[data-theme="dark"][data-style="ink"]{
  --bg:#0D0D0F; --card:#0D0D0F; --ink:#F4F4F6; --ink2:#A0A0AA; --ink3:#71717C;
  --line:#F4F4F6; --line2:#26262B; --edge:#F4F4F6; --ring-track:#26262B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet::-webkit-scrollbar,.chart::-webkit-scrollbar{width:0;height:0;display:none}
.sheet,.chart{scrollbar-width:none}
body{
  background:var(--bg); color:var(--ink);
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  font:16px/1.45 var(--font);
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{-webkit-user-select:text;user-select:text;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:var(--bw) solid var(--edge);border-radius:var(--rad-s);padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--p1)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--p1);outline-offset:1px}
.app{max-width:520px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1,h3{font-weight:var(--wt-h)}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.muted{color:var(--ink2)} .tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--rad-s);padding:11px 16px;
  font-weight:var(--wt);border:var(--bw) solid var(--line);background:var(--card);box-shadow:var(--shadow);
  transition:transform .06s ease,box-shadow .06s ease}
.btn:active{transform:translateY(var(--press));box-shadow:none}
.btn.primary{background:var(--p1);color:#fff;border-color:var(--line)}
.btn.small{padding:7px 13px;font-size:14px;border-radius:var(--rad-xs);box-shadow:var(--shadow-s)}
.btn.small:active{transform:translateY(var(--press))}
.btn.danger{color:var(--over);border-color:var(--over)}
/* avatars */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;
    font-weight:var(--wt-h);color:#fff;background:var(--ink3);overflow:hidden;line-height:1;border:var(--bw) solid var(--line)}
.av.c1{background:var(--p1)} .av.c2{background:var(--p2)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px;
  display:flex;flex-direction:column;gap:10px}
.datebar{display:flex;align-items:center;justify-content:space-between}
.datebar .dnav{width:42px;height:42px;border-radius:var(--rad-s);border:var(--bw) solid var(--line);background:var(--card);font-size:19px;font-weight:var(--wt-h);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-s)}
.datebar .dnav:active{transform:translateY(var(--press));box-shadow:none}
.datebar .dlabel{font-weight:700;font-size:17px;text-align:center}
.datebar .dsub{font-size:12.5px;color:var(--ink2);text-align:center}
/* ring */
.ringwrap{display:flex;align-items:center;gap:16px}
.ringnums .big{font-size:36px;font-weight:var(--wt-h);letter-spacing:-.02em;line-height:1.05}
.ringnums .big.over{color:var(--over)}
.eqn{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.eqn .bit{font-size:12px;color:var(--ink2);background:var(--line2);border-radius:999px;padding:4px 10px;font-weight:600}
.eqn .bit b{color:var(--ink)}
.macros{display:flex;gap:10px;margin-top:14px}
.macro{flex:1}
.macro .bar{height:9px;border-radius:5px;background:var(--ring-track);overflow:hidden;margin-top:5px;border:var(--bw-s) solid var(--line)}
.macro .bar i{display:block;height:100%;background:var(--mc)}
.macro.pro{--mc:var(--pro)} .macro.carb{--mc:var(--carb)} .macro.fat{--mc:var(--fat)}
.macro .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mc);margin-right:5px;vertical-align:1px}
.macro .bar i.full{background:var(--good)}
/* meals + entries */
.meal{margin-bottom:14px}
.mealhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 6px;gap:8px}
.mealhead .sv{font-size:12px;color:var(--p1);font-weight:600}
.entry{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--rad-s);
  padding:10px 12px;margin-bottom:8px;width:100%;text-align:left;box-shadow:var(--shadow-s);
  transition:transform .06s ease,box-shadow .06s ease}
.entry:active{transform:translateY(var(--press));box-shadow:none}
.eic{font-size:22px;flex:none;width:28px;text-align:center}
.fic{font-size:22px;flex:none;width:28px;text-align:center}
.entry .kc{font-weight:700}
.entry.ex .kc{color:var(--burn)}
.addline{width:100%;border:var(--bw) dashed var(--edge);border-radius:var(--rad-s);padding:11px;color:var(--ink2);font-weight:700;text-align:center}
.addline:active{transform:translateY(var(--press))}
/* water */
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.glass{width:28px;height:34px;border-radius:5px 5px 11px 11px;border:var(--bw) solid var(--water);background:transparent;transition:transform .1s ease}
.glass.on{transform:scale(1.06)}
.glass:active{transform:scale(.9)}
.glass.on{background:var(--water)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:520px;margin:0 auto;display:flex}
.tabs button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3)}
.tabs button.on{color:var(--ink)}
.tabs .ic{font-size:21px;line-height:1;transition:transform .12s ease}
.tabs button.on .ic{transform:scale(1.22) translateY(-1px)}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--sheet-scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;overscroll-behavior:contain;background:var(--bg);width:100%;max-width:520px;max-height:calc(88vh - env(safe-area-inset-top));border-radius:calc(var(--rad)*1.2) calc(var(--rad)*1.2) 0 0;border-top:var(--bw) solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet h3{font-size:18px;margin-bottom:12px;padding-right:42px}
.xclose{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--line2);color:var(--ink2);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;background:var(--line2);border-radius:var(--rad-s);padding:4px;margin-bottom:12px;border:var(--bw) solid var(--edge)}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);border-radius:var(--rad-xs);box-shadow:var(--shadow-s)}
.foodrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line2)}
.fmain{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:0}
.star{width:38px;height:38px;flex:none;border-radius:50%;font-size:18px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.star.on{color:#E0A32E}
.foodrow .fname{font-weight:600}
.foodrow .fsub{font-size:12.5px;color:var(--ink2)}
.stepper{display:flex;align-items:center;border:var(--bw) solid var(--line);border-radius:var(--rad-s);overflow:hidden}
.stepper button{width:44px;height:44px;font-size:20px;background:var(--card)}
.stepper .val{min-width:70px;text-align:center;font-weight:700}
.qtyrow{display:flex;gap:10px;align-items:center;margin:12px 0}
/* charts */
.chart{width:100%;overflow-x:auto}
.legend{display:flex;gap:14px;margin:2px 0 8px;flex-wrap:wrap}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.legend .sw{width:10px;height:10px;border-radius:3px}
#tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;pointer-events:none;display:none;max-width:220px}
/* us */
.uspair{display:flex;gap:10px}
.uscard{flex:1;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:14px;border-top:calc(var(--bw)*2.6) solid var(--line);min-width:0;box-shadow:var(--shadow)}
.uscard.c1{border-top-color:var(--p1)} .uscard.c2{border-top-color:var(--p2)}
.uscard .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* stats */
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:64px}
.stat .v{font-size:21px;font-weight:var(--wt-h);letter-spacing:-.01em}
.stat .k{font-size:11.5px;color:var(--ink2)}
/* forms */
.frow{display:flex;gap:10px;margin-bottom:10px}
.frow>div{flex:1;min-width:0}
.flabel{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.banner{background:var(--over-soft);color:var(--over);border-radius:var(--rad-xs);padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:var(--wt-h);border:var(--bw-s) solid currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.over{background:var(--over-soft);color:var(--over)}
.pill.burn{background:var(--burn-soft);color:var(--burn)}
details.dtable{margin-top:8px} details.dtable summary{font-size:12.5px;color:var(--ink3);cursor:pointer}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
table.data td,table.data th{padding:4px 6px;border-bottom:1px solid var(--line2);text-align:right}
table.data,.num,.fname,.fsub{-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(84px + env(safe-area-inset-bottom));
  z-index:50;display:flex;align-items:center;gap:14px;max-width:min(440px,92vw);
  background:var(--ink);color:var(--bg);border-radius:var(--rad-s);padding:11px 14px;
  font-size:14px;font-weight:var(--wt);box-shadow:0 6px 20px rgba(0,0,0,.28);
  opacity:0;visibility:hidden;
  transition:transform .22s cubic-bezier(.34,1.4,.64,1),opacity .18s ease,visibility .18s;
  pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
#toast button{color:var(--bg);font-weight:var(--wt-h);text-decoration:underline;flex:none}
@media (prefers-reduced-motion:reduce){#toast{transition:opacity .18s ease,visibility .18s}}
.whorow{display:flex;gap:6px;margin:2px 0 10px}
.whobtn{display:flex;align-items:center;gap:7px;flex:1;justify-content:center;padding:7px 10px;
  border:var(--bw-s) solid var(--edge);border-radius:999px;background:var(--card);
  font-size:13px;font-weight:var(--wt);color:var(--ink3)}
.whobtn.on{background:var(--card2);color:var(--ink);border-color:var(--ink3)}
.whobtn .av{flex:none}
.glass[disabled]{opacity:.85}
.eicwrap{width:34px;height:34px;border-radius:8px;overflow:hidden;flex:none;padding:0;display:block}
.eicwrap img{width:100%;height:100%;object-fit:cover;display:block}
.mealphoto{width:100%;border-radius:var(--rad-s);overflow:hidden;margin:2px 0 10px;
  background:var(--card2);border:var(--bw-s) solid var(--edge)}
.mealphoto img{width:100%;display:block;max-height:260px;object-fit:cover}
.mealphoto.big img{max-height:70vh;object-fit:contain}
.mealphoto.gone,.eicwrap.gone{display:none}
.nowrap{white-space:nowrap;flex:none}
.scanbox{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--rad-s);overflow:hidden;
  background:#000;border:var(--bw-s) solid var(--edge)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanaim{position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid rgba(255,255,255,.9);
  border-radius:8px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));grid-auto-rows:1fr;gap:6px;margin:2px 0 4px}
.cat{display:flex;align-items:center;gap:8px;min-height:46px;border:var(--bw-s) solid var(--edge);
  border-radius:var(--rad-s);padding:8px 10px;background:var(--card);text-align:left;color:var(--ink)}
.cat .cic{font-size:17px;flex:none;line-height:1}
.cat .cnm{font-size:12.5px;font-weight:var(--wt);line-height:1.25}
.cat:active{background:var(--card2)}
.linkbtn{font-size:11px;font-weight:var(--wt);color:var(--ink3);text-decoration:underline;text-transform:none;letter-spacing:0}
.usuals{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.usual{display:inline-flex;align-items:center;gap:5px;border:var(--bw-s) solid var(--edge);
  border-radius:999px;padding:6px 11px;font-size:13px;font-weight:var(--wt);background:var(--card)}
.usual b{font-weight:var(--wt-h);color:var(--ink2)}
.usual:active{transform:translateY(var(--press))}
.bank{margin-top:12px;border-radius:var(--rad-xs);padding:8px 12px;font-size:13.5px;font-weight:var(--wt)}
.bank.good{background:var(--good-soft);color:var(--good)}
.bank.over{background:var(--over-soft);color:var(--over)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots .dot{width:14px;height:14px;border-radius:4px;flex:none}
.dot.on{background:var(--good)}
.dot.over{background:var(--over-soft);border:2px solid var(--over)}
.dot.none{background:transparent;border:2px solid var(--edge)}
.dot.pre{background:transparent;border:2px dotted var(--line2)}
.legend .li .dot{width:11px;height:11px;border-radius:3px;margin-right:5px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw-btn{flex:1;min-width:70px;border:var(--bw) solid var(--line);border-radius:var(--rad-s);
  padding:9px 6px 8px;background:var(--card);box-shadow:var(--shadow-s);text-align:center;font-size:11.5px;font-weight:var(--wt)}
.sw-btn.on{outline:3px solid var(--p1);outline-offset:2px}
.sw-btn .chips{display:flex;gap:3px;justify-content:center;margin-bottom:6px}
.sw-btn .chips i{width:15px;height:15px;display:block}
.modeseg{display:flex;background:var(--line2);border-radius:var(--rad-xs);padding:4px;border:var(--bw-s) solid var(--edge)}
.modeseg button{flex:1;padding:7px 4px;border-radius:calc(var(--rad-xs) - 3px);font-size:13px;font-weight:var(--wt);color:var(--ink2)}
.modeseg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-s)}
.tipbar{background:var(--p1-soft);border:1px solid var(--p1);border-radius:var(--rad-xs);padding:10px 12px;font-size:13px;margin:10px 0 0}
table.data th:first-child,table.data td:first-child{text-align:left}
@media (prefers-reduced-motion:no-preference){
  .ringprog{transition:stroke-dashoffset .6s cubic-bezier(.34,1.56,.64,1)}
  .card{animation:pop .26s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
  .sheet{animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}

/* Storage tiers, best first. Sandboxed hosts block some but rarely all;
   whichever survives the probe is the one every save goes through. */
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej();
    let rq;try{rq=indexedDB.open("twospoons",1);}catch(e){return rej();}
    rq.onupgradeneeded=()=>{rq.result.createObjectStore("kv");};
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(); rq.onblocked=()=>rej();
    setTimeout(rej,2500);
  });
}
function idbReq(db,mode,fn){
  return new Promise((res,rej)=>{
    let tx;try{tx=db.transaction("kv",mode);}catch(e){return rej();}
    const rq=fn(tx.objectStore("kv"));
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej();
  });
}
const Store={
  tier:"memory", mem:null, db:null,
  async init(){
    try{localStorage.setItem("__t","1");localStorage.removeItem("__t");this.tier="local";return;}catch(e){}
    try{this.db=await idbOpen();await idbReq(this.db,"readwrite",s=>s.put(1,"__t"));this.tier="idb";return;}catch(e){}
    this.tier="memory";
  },
  async load(){
    if(this.tier==="local"){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
    if(this.tier==="idb"){try{return await idbReq(this.db,"readonly",s=>s.get(KEY))||null;}catch(e){return null;}}
    return this.mem;
  },
  save(state){
    if(this.tier==="local"){
      try{localStorage.setItem(KEY,JSON.stringify(state));return;}
      catch(e){this.quota=true;this.tier="memory";}
    }
    if(this.tier==="idb"){
      this.mem=state;
      idbReq(this.db,"readwrite",s=>s.put(JSON.parse(JSON.stringify(state)),KEY)).catch(()=>{this.tier="memory";});
      return;
    }
    this.mem=state;
  },
  saving(){return this.tier!=="memory";},
  where(){return this.tier==="local"?"this device":this.tier==="idb"?"this device (browser database)":"backup files only";}
};
function persist(){S.dirtyAt=Date.now();Store.save(S);if(typeof syncSoon==="function")syncSoon();}

/* --- undo: snapshot the day before a change, offer it back briefly --- */
let undoState=null, undoTimer=null;
function snapshotDay(pid,date){
  return JSON.parse(JSON.stringify({logs:S.logs[pid][date]||[],ex:S.ex[pid][date]||[]}));
}
function offerUndo(label,pid,date,before){
  undoState={pid:pid,date:date,before:before};
  const t=$("#toast");
  t.innerHTML='<span class="grow">'+esc(label)+'</span><button id="undoBtn">Undo</button>';
  t.classList.add("show");
  $("#undoBtn").onclick=()=>{
    if(!undoState)return;
    S.logs[undoState.pid][undoState.date]=undoState.before.logs;
    S.ex[undoState.pid][undoState.date]=undoState.before.ex;
    undoState=null;hideToast();persist();render();
  };
  clearTimeout(undoTimer);
  undoTimer=setTimeout(hideToast,5000);
}
function hideToast(){const t=$("#toast");if(t)t.classList.remove("show");undoState=null;}
/* memory-only: nothing on disk, so don't let a stray tab close eat the day */
window.addEventListener("beforeunload",e=>{
  if(Store.saving())return;
  if(!S.dirtyAt||(S.backedUpAt&&S.backedUpAt>=S.dirtyAt))return;
  e.preventDefault();e.returnValue="";
});

  r.setAttribute("data-style",S.style||"sticker");

  else r.removeAttribute("data-theme");

             window.matchMedia("(prefers-color-scheme: dark)").matches);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",getComputedStyle(document.body).backgroundColor||(dark?"#141F1C":"#FFF6E9"));
}

function blank(){

    style:"sticker",mode:"auto",period:7,
    active:"a",tab:"today",date:todayStr(),
    profiles:{a:newProfile("a","male",172,70), b:newProfile("b","female",160,55)},
    logs:{a:{},b:{}}, ex:{a:{},b:{}}, water:{a:{},b:{}},

let S=blank();
/* fills in anything a older save (or a partial import) is missing */
function migrate(st){
  const base=blank();
  st.v=3;
  if(!st.me)st.me="a";
  /* sync arrived after these two had already paired: the one who started the journey
     mints the credentials, and the other picks them up from a fresh invite */
  if(st.setup&&!st.sync&&st.me==="a"&&window.crypto&&crypto.getRandomValues)st.sync=newSyncCreds();
  st.journey=st.journey||{start:null};
  if(st.setup&&!st.journey.start){
    let first=null;
    for(const pid of ["a","b"])for(const d in (st.logs&&st.logs[pid])||{}){if(!first||d<first)first=d;}
    st.journey.start=first||todayStr();
  }
  delete st.aiKey;   /* photo analysis was removed; drop any key left behind */
  if(st.paired===undefined)st.paired=!!(st.setup&&st.profiles&&st.profiles.b&&st.profiles.b.name);
  st.active=st.me;
  st.date=st.date||todayStr();
  st.style=st.style||"sticker"; st.mode=st.mode||"auto"; st.period=st.period||7;
  st.setupStep=st.setupStep||(st.setup?"done":"welcome");
  for(const k of ["logs","ex","water","weights","recents","favs"]){
    st[k]=st[k]||{}; st[k].a=st[k].a||base[k].a; st[k].b=st[k].b||base[k].b;
  }
  st.custom=st.custom||[]; st.savedMeals=st.savedMeals||[];
  st.profiles=st.profiles||base.profiles;
  for(const pid of ["a","b"]){
    const p=Object.assign(newProfile(pid,pid==="a"?"male":"female",pid==="a"?172:160,pid==="a"?70:55),st.profiles[pid]||{});
    if(p.waterTarget==null)p.waterTarget=8;
    st.profiles[pid]=p;
  }
  return st;
}
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2,8));}
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(ds,n){const p=ds.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return todayStr(d);}
function niceDate(ds){const p=ds.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);
  if(ds===todayStr())return "Today";
  if(ds===addDays(todayStr(),-1))return "Yesterday";
  return d.toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"});}
function r0(n){return Math.round(n);}
function baseBudget(p){
  if(p.override) return p.override;
  const w=latestWeight(p.id)||p.weight;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="male"?5:-161);
  return Math.max(1200,r0(bmr*ACT[p.activity]+PACE[p.pace]));
}
function latestWeight(pid){const ws=S.weights[pid];return ws&&ws.length?ws[ws.length-1].kg:null;}
function entries(pid,date){return (S.logs[pid][date])||[];}
function exEntries(pid,date){return (S.ex[pid][date])||[];}
function dayKcal(pid,date){return entries(pid,date).reduce((a,e)=>a+e.kcal*e.qty,0);}
function dayBurn(pid,date){return exEntries(pid,date).reduce((a,e)=>a+e.kcal,0);}
function dayBudget(pid,date){return baseBudget(S.profiles[pid])+dayBurn(pid,date);}
function dayMacro(pid,date,k){return entries(pid,date).reduce((a,e)=>a+(e[k]||0)*e.qty,0);}
function dayWater(pid,date){return (S.water[pid][date])||0;}
function anyLogged(pid,date){return entries(pid,date).length>0||exEntries(pid,date).length>0;}
function prof(){return S.profiles[S.active];}
function colorOf(pid){return pid==="a"?"var(--p1)":"var(--p2)";}
function streak(pid){
  let n=0,d=todayStr();
  if(!anyLogged(pid,d)) d=addDays(d,-1);
  while(anyLogged(pid,d)){n++;d=addDays(d,-1);}
  return n;
}

function initials(name){

  return (parts[0][0]+(parts[1]?parts[1][0]:"")).toUpperCase();
}

function ringSVG(eaten,bud,size,color){
  size=size||130;
  const r=(size-14)/2, C=2*Math.PI*r, frac=Math.min(1,bud?eaten/bud:0);
  const over=eaten>bud;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+r0(eaten)+' of '+r0(bud)+' kcal">'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--ring-track)" stroke-width="11"/>'+
   '<circle class="ringprog" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(over?"var(--over)":color)+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-frac)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
   '<text x="50%" y="46%" text-anchor="middle" font-size="'+size*0.2+'" font-weight="800" fill="var(--ink)" class="num">'+r0(eaten)+'</text>'+
   '<text x="50%" y="62%" text-anchor="middle" font-size="'+size*0.085+'" fill="var(--ink3)">of '+r0(bud)+' kcal</text></svg>';
}

function todayHTML(){

  const P=dayMacro(p.id,S.date,"p"),C=dayMacro(p.id,S.date,"c"),F=dayMacro(p.id,S.date,"f");
  const tP=r0(bud*0.3/4),tC=r0(bud*0.4/4),tF=r0(bud*0.3/9);
  const col=colorOf(p.id);

    ((S.sync&&S.sync.err&&S.sync.on!==false)
      ? '<p class="tiny muted" style="margin:2px 2px 10px;text-align:center">'+esc(S.sync.err)+'</p>' : "")+
    (ro?'<p class="tiny muted" style="margin:2px 2px 10px;text-align:center">'+

    '<div class="ringnums grow"><div class="label">'+(left>=0?"Remaining":"Over budget")+'</div>'+
    '<div class="big num '+(left<0?"over":"")+'">'+r0(Math.abs(left))+'</div>'+
    '<div class="tiny muted">kcal</div>'+
    (streak(p.id)>1?'<div class="tiny" style="margin-top:6px">🔥 <b class="num">'+streak(p.id)+'</b>-day streak</div>':"")+
    '</div></div>'+
    '<div class="eqn">'+(ro?'<span class="bit">Budget <b class="num">'+base+'</b></span>'
      :'<button class="bit" data-act="budget">Budget <b class="num">'+base+'</b>'+(p.override?' ✏️':'')+'</button>')+
      (burn?'<span class="bit">+ Exercise <b class="num" style="color:var(--burn)">'+r0(burn)+'</b></span>':"")+
      '<span class="bit">− Eaten <b class="num">'+r0(eaten)+'</b></span></div>'+
    '<div class="macros">'+macroHTML("Protein",P,tP,"pro")+macroHTML("Carbs",C,tC,"carb")+macroHTML("Fat",F,tF,"fat")+'</div>'+
    bankLineHTML(p.id)+'</section>';

    '<div class="glasses">'+Array.from({length:wt},(_,i)=>'<button class="glass '+(i<w?"on":"")+'"'+
      (ro?' disabled':' data-act="water" data-n="'+(i+1)+'"')+' aria-label="'+(i+1)+' glasses"></button>').join("")+
    (w>wt?'<span class="tiny num" style="align-self:center;color:var(--water)">+'+(w-wt)+'</span>':"")+'</div>'+
    (ro?"":'<div class="row" style="margin-top:10px"><button class="btn small" data-act="waterminus">−</button><button class="btn small" data-act="waterplus">+ Glass</button></div>')+'</section>';
  /* meals */
  const es=entries(p.id,S.date);
  for(const m of MEALS){
    const list=es.filter(e=>e.meal===m);
    const sub=list.reduce((a,e)=>a+e.kcal*e.qty,0);
    html+='<div class="meal"><div class="mealhead"><span class="label">'+m+'</span><span class="grow"></span>'+

      '<span class="tiny muted num">'+(sub?r0(sub)+" kcal":"")+'</span></div>';

      html+='<button class="entry" data-act="'+(ro?"viewent":"edit")+'" data-id="'+e.id+'"><span class="eic'+(e.photo?' eicwrap':'')+'">'+
        (e.photo?'<img data-photo="'+esc(e.id)+'" alt="">':(e.ic||"🍽️"))+'</span><span class="grow"><span style="font-weight:600">'+esc(e.name)+'</span><br><span class="tiny muted num">'+(e.qty!==1?e.qty+" × ":"")+esc(e.serving||"serving")+'</span></span><span class="kc num">'+r0(e.kcal*e.qty)+'</span></button>';
    }
    html+=(ro?(list.length?"":'<p class="tiny muted" style="padding:6px 2px">Nothing logged.</p>')

  if(!ro && !es.length && entries(p.id,addDays(S.date,-1)).length){
    html+='<button class="btn" style="width:100%" data-act="copyday">📋 Copy food from yesterday</button>';

/* ================= meal photos =================
   A photo is thousands of times bigger than the line of text it illustrates, so
   photos live in their own database and the entry only remembers that it has one.
   That keeps the saved state small enough for localStorage, and keeps backups and
   invite codes as text you can actually paste. The trade: photos stay on the phone
   that took them — they don't travel to your partner's copy. */
const PhotoStore={
  db:null, ready:false, tried:false,
  async open(){
    if(this.tried)return this.db;
    this.tried=true;
    this.db=await new Promise(res=>{
      if(!window.indexedDB)return res(null);
      let rq; try{ rq=indexedDB.open("twospoons_photos",1); }catch(e){ return res(null); }
      rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore("p"); }catch(e){} };
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
      setTimeout(()=>res(null),2500);
    });
    this.ready=!!this.db;
    return this.db;
  },
  tx(mode,fn){
    return new Promise((res,rej)=>{
      if(!this.db)return rej(new Error("no store"));
      let t; try{ t=this.db.transaction("p",mode); }catch(e){ return rej(e); }
      const rq=fn(t.objectStore("p"));
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error||new Error("failed"));
    });
  },
  put(id,data){ return this.tx("readwrite",s=>s.put(data,id)); },
  get(id){ return this.tx("readonly",s=>s.get(id)); },
  del(id){ return this.tx("readwrite",s=>s.delete(id)); },
  keys(){ return this.tx("readonly",s=>s.getAllKeys()); },
  all(){ return this.tx("readonly",s=>s.getAll()); },
  async usage(){
    try{
      const v=await this.all();
      return {count:v.length, bytes:v.reduce((a,b)=>a+(b?b.length:0),0)};
    }catch(e){ return {count:0,bytes:0}; }
  },
  async clear(){ try{ await this.tx("readwrite",s=>s.clear()); }catch(e){} }
};
const photoCache={};
function photoBytesLabel(b){
  return b<1024?b+" B":b<1024*1024?Math.round(b/1024)+" KB":(b/1048576).toFixed(1)+" MB";
}

function livePhotoIds(){

/* shrink to something a phone screen can show but a database won't groan under */
function shrinkImage(file,maxEdge,quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("read"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("decode"));
      img.onload=()=>{
        const m=Math.max(img.width,img.height)||1;
        const sc=Math.min(1,maxEdge/m);
        const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(cv.toDataURL("image/jpeg",quality)); }catch(e){ rej(new Error("encode")); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---- photos across the sync ----
   Photos are far too big to sit in a code you paste into WhatsApp, but they travel
   fine in a file. So the file carries them and the pasted code doesn't, and both
   say which they are. Recent days only, and a ceiling on the count, so a year of
   meals never turns into a file nobody can send. */
const PHOTO_SYNC_DAYS=45, PHOTO_SYNC_MAX=200;
async function photosForExport(){
  if(!PhotoStore.ready)return {photos:{},skipped:0};
  const cutoff=addDays(todayStr(),-PHOTO_SYNC_DAYS);
  const wanted=[];
  for(const pid of ["a","b"])
    for(const d in (S.logs[pid]||{})){
      if(d<cutoff)continue;
      for(const e of S.logs[pid][d]) if(e.photo) wanted.push({id:e.id,d:d});
    }
  wanted.sort((x,y)=>x.d<y.d?1:-1);              /* newest first, so a cap keeps the recent ones */
  const take=wanted.slice(0,PHOTO_SYNC_MAX);
  const photos={};
  for(const w of take){
    try{ const data=await PhotoStore.get(w.id); if(data)photos[w.id]=data; }catch(e){}
  }
  return {photos:photos,skipped:Math.max(0,wanted.length-take.length)};
}
async function backupJSONWithPhotos(){
  const p=await photosForExport();
  return JSON.stringify({app:"twospoons",exportedAt:new Date().toISOString(),
    state:exportableState(),photos:p.photos});
}
async function importPhotos(obj){
  if(!obj||!obj.photos)return 0;
  if(!PhotoStore.ready)await PhotoStore.open();
  if(!PhotoStore.ready)return 0;
  let n=0;
  for(const id in obj.photos){
    const data=obj.photos[id];
    if(typeof data!=="string"||data.indexOf("data:image/")!==0)continue;
    const ent=findEntry(id);
    if(!ent)continue;                             /* only photos for entries we actually took on */
    try{ await PhotoStore.put(id,data); photoCache[id]=data; ent.photo=1; n++; }catch(e){}
  }
  if(n)persist();
  return n;
}

/* ================= barcode =================
   EAN-13, EAN-8 and UPC-A, decoded here rather than by the browser: Safari ships
   BarcodeDetector switched off, so on an iPhone the native one isn't there. Where a
   working native detector exists we use it, because it's faster and reads more
   symbologies; otherwise this runs.

   A barcode is a row of bars whose *relative* widths carry the digits. So: take one
   row of pixels, split it into runs of dark and light, and match each group of four
   runs against the twelve known digit patterns. */
const EAN_L=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],
             [1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const EAN_G=EAN_L.map(p=>p.slice().reverse());
/* which of the six left digits use the G set spells out the 13th (leading) digit */
const EAN_PAR=["000000","001011","001101","001110","010011",
               "011001","011100","010101","010110","011010"];

function bcRuns(gray){
  let mn=255,mx=0;
  for(let i=0;i<gray.length;i++){const v=gray[i];if(v<mn)mn=v;if(v>mx)mx=v;}
  if(mx-mn<48)return null;                      /* too flat to be a barcode */
  const th=(mn+mx)/2, runs=[];
  let cur=gray[0]<th, len=1;
  for(let i=1;i<gray.length;i++){
    const dark=gray[i]<th;
    if(dark===cur)len++; else {runs.push(len);cur=dark;len=1;}
  }
  runs.push(len);
  return {runs:runs,firstDark:gray[0]<th};
}
function bcDigit(runs,i,sets){
  let total=0;
  for(let k=0;k<4;k++){ if(runs[i+k]===undefined)return null; total+=runs[i+k]; }
  const unit=total/7;
  if(unit<=0)return null;
  let best=null,bestErr=1.0;                    /* total module error allowed over 4 runs */
  for(let s=0;s<sets.length;s++)
    for(let d=0;d<10;d++){
      let err=0;
      for(let k=0;k<4;k++)err+=Math.abs(runs[i+k]/unit-sets[s][d][k]);
      if(err<bestErr){bestErr=err;best={d:d,set:s};}
    }
  return best;
}
function bcGuard(runs,i,n){                     /* n equal-width runs */
  let total=0;
  for(let k=0;k<n;k++){ if(runs[i+k]===undefined)return 0; total+=runs[i+k]; }
  const unit=total/n;
  if(unit<=0)return 0;
  for(let k=0;k<n;k++) if(Math.abs(runs[i+k]/unit-1)>0.45)return 0;
  return unit;
}
function bcCheck(s){
  const n=s.length, w=(n===13)?[1,3]:[3,1];
  let sum=0;
  for(let i=0;i<n-1;i++)sum+=(+s[i])*w[i%2];
  return (10-(sum%10))%10===+s[n-1];
}
function bcAt(runs,firstDark,i){
  /* a barcode starts on a dark bar */
  const dark=firstDark?(i%2===0):(i%2===1);
  if(!dark)return null;
  const unit=bcGuard(runs,i,3);
  if(!unit)return null;

  for(const spec of [{left:6,total:13},{left:4,total:8}]){
    const L=spec.left;
    let j=i+3, digits=[], parity="", ok=true;
    for(let d=0;d<L;d++){
      const m=bcDigit(runs,j,spec.total===13?[EAN_L,EAN_G]:[EAN_L]);
      if(!m){ok=false;break;}
      digits.push(m.d); parity+=m.set; j+=4;
    }
    if(!ok)continue;
    if(!bcGuard(runs,j,5))continue;             /* centre guard */
    j+=5;
    for(let d=0;d<L;d++){
      const m=bcDigit(runs,j,[EAN_L]);          /* right digits: same widths, inverted */
      if(!m){ok=false;break;}
      digits.push(m.d); j+=4;
    }
    if(!ok)continue;
    if(!bcGuard(runs,j,3))continue;             /* end guard */

    let code;
    if(spec.total===13){
      const first=EAN_PAR.indexOf(parity);
      if(first<0)continue;
      code=String(first)+digits.join("");
    } else code=digits.join("");
    if(code.length===spec.total&&bcCheck(code))return code;
  }
  return null;
}
function bcScanLine(gray){
  const r=bcRuns(gray);
  if(!r)return null;
  for(let i=0;i<r.runs.length-40;i++){
    const hit=bcAt(r.runs,r.firstDark,i);
    if(hit)return hit;
  }
  /* the label may be upside down */
  const rev=r.runs.slice().reverse();
  const revFirstDark=(r.runs.length%2===1)?r.firstDark:!r.firstDark;
  for(let i=0;i<rev.length-40;i++){
    const hit=bcAt(rev,revFirstDark,i);
    if(hit)return hit;
  }
  return null;
}
function bcScanImage(data,w,h,lines){
  /* sample rows across the middle of the frame — a barcode only needs one good one */
  const n=lines||15, out={};
  for(let k=0;k<n;k++){
    const y=Math.floor(h*(0.2+0.6*(k/(n-1||1))));
    const gray=new Uint8Array(w);
    for(let x=0;x<w;x++){
      const p=(y*w+x)*4;
      gray[x]=(data[p]*77+data[p+1]*151+data[p+2]*28)>>8;
    }
    const code=bcScanLine(gray);
    if(code){out[code]=(out[code]||0)+1;}
  }
  let best=null,bestN=0;
  for(const c in out) if(out[c]>bestN){best=c;bestN=out[c];}
  return best?{code:best,lines:bestN}:null;
}

/* ================= online lookup =================
   Open Food Facts: free, no API key, sends Access-Control-Allow-Origin: *.
   Packaged and barcoded products, contributed by the public — good for a snack
   or a drink off the shelf, thin on cooked hawker food. Never called on its own:
   it only runs when you tap the button, because it sends what you typed to
   another company's server. */
let onlineState={q:"",busy:false,err:"",results:null,retryQ:""};
const OFF_URL="https://world.openfoodfacts.org/cgi/search.pl";
const ENT={quot:'"',amp:"&",lt:"<",gt:">",apos:"'",nbsp:" "};
function offText(str){
  /* names in Open Food Facts often arrive with entities baked into the text */
  return String(str||"")
    .replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d))
    .replace(/&([a-zA-Z]+);/g,(m,w)=>ENT[w.toLowerCase()]!==undefined?ENT[w.toLowerCase()]:m)
    .replace(/\s+/g," ").trim();
}
function offServing(n,sizeText){
  /* prefer the label's own serving; fall back to 100 g */
  const kS=n["energy-kcal_serving"];
  if(kS>0) return {serving:(sizeText||"1 serving"),kcal:kS,
    p:n.proteins_serving||0,c:n.carbohydrates_serving||0,f:n.fat_serving||0};
  const k100=n["energy-kcal_100g"];
  if(k100>0) return {serving:"100 g",kcal:k100,
    p:n.proteins_100g||0,c:n.carbohydrates_100g||0,f:n.fat_100g||0};
  return null;
}
async function offFetch(url,tries){
  /* Open Food Facts is a volunteer-run service and hands out 503s when it is busy,
     so one refusal means very little. Try a few times, spaced out, then stop. */
  let last=null;
  for(let i=0;i<tries;i++){
    if(i) await new Promise(r=>setTimeout(r,300+i*700));
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),7000);
      const r=await fetch(url,{signal:ctrl.signal});
      clearTimeout(timer);
      if(r.ok) return r;
      last=new Error("busy");
    }catch(e){ last=e; }
  }
  throw last||new Error("busy");
}
async function lookupOnline(q){
  if(onlineState.busy) return;
  onlineState={q:q,busy:true,err:"",results:null};
  paintOnline();
  try{
    const url=OFF_URL+"?search_terms="+encodeURIComponent(q)+
      "&search_simple=1&action=process&json=1&page_size=20"+
      "&fields=product_name,brands,nutriments,serving_size";
    const r=await offFetch(url,5);
    const j=await r.json();
    const out=[];
    for(const prod of (j.products||[])){
      let nm=offText(prod.product_name);
      if(!nm) continue;
      const per=offServing(prod.nutriments||{},offText(prod.serving_size));
      if(!per) continue;
      const brand=offText((prod.brands||"").split(",")[0]);
      if(brand && nm.toLowerCase().indexOf(brand.toLowerCase())<0) nm=brand+" "+nm;
      if(nm.length>52) nm=nm.slice(0,51).trim()+"\u2026";
      if(out.some(x=>x.name.toLowerCase()===nm.toLowerCase())) continue;
      out.push({name:nm,
        serving:per.serving,kcal:Math.round(per.kcal),p:Math.round(per.p),
        c:Math.round(per.c),f:Math.round(per.f),ic:"📦",online:true});
      if(out.length>=12) break;
    }
    onlineState.results=out;
  }catch(e){
    onlineState.err=(e.name==="AbortError")
      ? "That took too long. Tap again, or add it under Custom."
      : "Open Food Facts didn't answer. It's a free service run by volunteers and it "+
        "goes down often — tap again in a moment, or add it under Custom and be done with it.";
    onlineState.retryQ=q;
  }
  onlineState.busy=false;
  paintOnline();
}
function onlineHTML(){
  if(onlineState.busy) return '<p class="tiny muted" style="text-align:center;padding:14px">Looking up “'+esc(onlineState.q)+'” online…</p>';
  if(onlineState.err) return '<p class="tiny muted" style="padding:12px 2px 8px">'+esc(onlineState.err)+'</p>'+
    (onlineState.retryQ?'<div class="row"><button class="btn small grow" data-online="'+esc(onlineState.retryQ)+'">Try again</button></div>':"");
  if(!onlineState.results) return "";
  if(!onlineState.results.length)
    return '<p class="tiny muted" style="text-align:center;padding:14px">Nothing online either. Custom lets you enter it once and keep it.</p>';
  return '<div class="label" style="margin:12px 0 2px">From Open Food Facts</div>'+
    '<p class="tiny muted" style="margin:0 0 6px">Packaged products, entered by the public — worth a glance before you add it.</p>'+
    onlineState.results.map(foodRowHTML).join("");
}
function paintOnline(){

/* ---- camera scanning + barcode lookup ---- */
let scanStream=null, scanTimer=null, scanBusy=false, nativeBCd;
let scanState={on:false,err:"",code:"",busy:false,notFound:false,noData:""};
function nativeBC(){
  if(nativeBCd!==undefined)return nativeBCd;
  try{
    nativeBCd=("BarcodeDetector" in window)
      ? new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]}) : null;
  }catch(e){nativeBCd=null;}
  return nativeBCd;
}
function stopScan(){
  if(scanTimer){clearInterval(scanTimer);scanTimer=null;}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
  scanState.on=false; scanBusy=false;
}
async function startScan(){
  scanState.err="";scanState.notFound=false;scanState.noData="";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    scanState.err="This browser won't give a web page the camera. Type the number instead.";
    refreshSheet();return;
  }
  try{
    scanStream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    scanState.err=(e&&e.name==="NotAllowedError")
      ? "Camera permission was turned down. Allow it in your browser settings, or type the number below."
      : (e&&e.name==="NotFoundError")
      ? "No camera found on this device. Type the number below."
      : "Couldn't start the camera. Type the number below.";
    refreshSheet();return;
  }
  scanState.on=true; refreshSheet();
  const v=$("#scanVid");
  if(!v){stopScan();return;}
  v.srcObject=scanStream;
  v.setAttribute("playsinline","");v.muted=true;
  try{ await v.play(); }catch(e){}
  const cv=document.createElement("canvas");
  scanTimer=setInterval(()=>scanTick(v,cv),120);
}
async function scanTick(v,cv){
  if(scanBusy||!scanState.on)return;
  if(!v.videoWidth)return;
  scanBusy=true;
  try{
    const W=Math.min(640,v.videoWidth);
    const H=Math.round(v.videoHeight*(W/v.videoWidth));
    cv.width=W;cv.height=H;
    const cx=cv.getContext("2d",{willReadFrequently:true});
    cx.drawImage(v,0,0,W,H);
    let code=null;
    const nd=nativeBC();
    if(nd){
      try{ const hits=await nd.detect(cv); if(hits&&hits.length)code=hits[0].rawValue; }catch(e){}
    }
    if(!code){
      const id=cx.getImageData(0,0,W,H);
      const hit=bcScanImage(id.data,W,H,15);
      if(hit)code=hit.code;
    }
    if(code&&/^\d{8}$|^\d{12,13}$/.test(code)){
      stopScan();
      if(navigator.vibrate)try{navigator.vibrate(40);}catch(e){}
      lookupBarcode(code);
    }
  }catch(e){}
  scanBusy=false;
}
async function lookupBarcode(code){
  scanState={on:false,err:"",code:code,busy:true,notFound:false,noData:""};
  sheetTab="scan"; refreshSheet();
  const tryCodes=[code];
  if(code.length===13&&code[0]==="0")tryCodes.push(code.slice(1));  /* UPC-A read as EAN-13 */
  if(code.length===12)tryCodes.push("0"+code);
  try{
    let prod=null;
    for(const c of tryCodes){
      const url="https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(c)+
        ".json?fields=product_name,brands,nutriments,serving_size";
      const r=await offFetch(url,4);
      const j=await r.json();
      if(j&&j.status===1&&j.product){prod=j.product;break;}
    }
    if(!prod){ scanState.notFound=true; }
    else{
      let nm=offText(prod.product_name);
      const brand=offText((prod.brands||"").split(",")[0]);
      if(brand&&nm.toLowerCase().indexOf(brand.toLowerCase())<0)nm=(brand+" "+nm).trim();
      if(!nm)nm="Barcode "+code;
      if(nm.length>52)nm=nm.slice(0,51).trim()+"…";
      const per=offServing(prod.nutriments||{},offText(prod.serving_size));
      if(!per) scanState.noData=nm;
      else{
        pickedFood={name:nm,serving:per.serving,kcal:Math.round(per.kcal),p:Math.round(per.p),
          c:Math.round(per.c),f:Math.round(per.f),ic:"📦",online:true};
        pickedQty=1; scanState.busy=false; refreshSheet(); return;
      }
    }
  }catch(e){
    scanState.err="Couldn't reach Open Food Facts. It goes down often — tap Try again in a moment.";
  }
  scanState.busy=false; refreshSheet();
}

function searchFoods(q,limit){
  const fs=allFoods();
  if(!q) return fs.slice(0,limit);
  const ql=q.toLowerCase().trim();
  const toks=ql.split(/\s+/).filter(Boolean);
  return fs.map(f=>{
    const hay=(f.name+" "+(f.kw||"")).toLowerCase();
    const words=hay.split(/[^a-z0-9]+/);
    let sc=0;
    for(const t of toks){
      if(words.includes(t))sc+=t.length*2;
      else if(hay.includes(t))sc+=t.length;
    }
    if(f.name.toLowerCase()===ql)sc+=100;
    else if(f.name.toLowerCase().startsWith(ql))sc+=10;
    return [sc,f];
  }).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,limit).map(x=>x[1]);
}

/* quick log parser */
function parseQuick(text){
  const parts=text.split(/[+,]| and /i).map(s=>s.trim()).filter(Boolean);
  return parts.map(part=>{
    let qty=1, q=part.toLowerCase();
    const m=q.match(/^(\d+(?:\.\d+)?|half|quarter)\s*(?:x|×)?\s+/);
    if(m){qty=m[1]==="half"?0.5:m[1]==="quarter"?0.25:parseFloat(m[1]);q=q.slice(m[0].length);}
    if(!(qty>0)||qty>10)qty=1;
    const hits=searchFoods(q,1);
    const food=hits[0]||null;
    /* "2 soft boiled eggs" vs a serving already sized "2 eggs": collapse to 1× */
    if(food&&qty!==1){
      const sm=String(food.serving).match(/^(\d+(?:\.\d+)?)/);
      if(sm&&parseFloat(sm[1])===qty)qty=1;
    }
    return {raw:part,qty:qty,food:food};
  });
}

/* ================= charts ================= */
function barChart(days,series,bud){
  const W=488,H=170,padL=6,padB=18,padT=14;
  const maxV=Math.max(bud||0,...series.flatMap(s=>s.vals))*1.08||100;
  const n=days.length, slot=(W-padL)/n, bw=series.length===2?Math.min(14,slot/2-3):Math.min(22,slot-4);
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  if(bud){svg+='<line x1="0" x2="'+W+'" y1="'+y(bud)+'" y2="'+y(bud)+'" stroke="var(--ink3)" stroke-dasharray="4 4" stroke-width="1"/>'+
    '<text x="'+(W-2)+'" y="'+(y(bud)-4)+'" text-anchor="end" font-size="10" fill="var(--ink3)" class="num">budget '+r0(bud)+'</text>';}
  days.forEach((d,i)=>{
    const cx=padL+slot*i+slot/2;
    series.forEach((s,si)=>{
      const v=s.vals[i]; if(v<=0)return;
      const x=series.length===2?cx-bw-1+(si*(bw+2)):cx-bw/2;
      const h=Math.max(2,(H-padT-padB)*v/maxV);
      svg+='<rect x="'+x+'" y="'+y(v)+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+s.color+'" data-tip="'+niceDate(d)+" · "+r0(v)+' kcal"/>';
      svg+='<rect x="'+x+'" y="'+(H-padB-Math.min(4,h))+'" width="'+bw+'" height="'+Math.min(4,h)+'" fill="'+s.color+'"/>';
    });
    const lab=d.slice(8);
    if(n<=14||i%2===0)svg+='<text x="'+cx+'" y="'+(H-4)+'" text-anchor="middle" font-size="9.5" fill="var(--ink3)" class="num">'+(+lab)+'</text>';
  });
  svg+='<line x1="0" x2="'+W+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--line)"/></svg>';
  return '<div class="chart">'+svg+'</div>';
}
function lineChart(pts,color,unit,goal){
  if(pts.length<2)return '<p class="tiny muted">Log at least two entries to see the trend.</p>';
  const W=488,H=150,padL=6,padR=42,padT=12,padB=16;
  const vs=pts.map(p=>p.v).concat(goal?[goal]:[]);
  let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi-lo<2){lo-=1;hi+=1;} const span=hi-lo; lo-=span*0.15; hi+=span*0.15;
  const t0=new Date(pts[0].d).getTime(),t1=new Date(pts[pts.length-1].d).getTime()||t0+1;
  const x=d=>padL+(W-padL-padR)*((new Date(d).getTime()-t0)/Math.max(1,t1-t0));
  const y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
  const path=pts.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">'+
   '<line x1="0" x2="'+W+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--line)"/>';
  if(goal){svg+='<line x1="0" x2="'+(W-padR)+'" y1="'+y(goal)+'" y2="'+y(goal)+'" stroke="var(--good)" stroke-dasharray="4 4" stroke-width="1.5"/>'+
    '<text x="'+(W-2)+'" y="'+(y(goal)+4)+'" text-anchor="end" font-size="10" fill="var(--good)" class="num">goal '+goal+'</text>';}
  svg+='<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  for(const p of pts){svg+='<circle cx="'+x(p.d)+'" cy="'+y(p.v)+'" r="4" fill="'+color+'" stroke="var(--card)" stroke-width="2" data-tip="'+niceDate(p.d)+" · "+p.v+" "+unit+'"/>';}
  svg+='<circle cx="'+x(last.d)+'" cy="'+y(last.v)+'" r="5" fill="'+color+'" stroke="var(--card)" stroke-width="2"/>'+

/* ================= Trends ================= */
function weekStats(pid,n){
  const days=[];for(let i=n-1;i>=0;i--)days.push(addDays(todayStr(),-i));
  const logged=days.filter(d=>anyLogged(pid,d));
  const inV=logged.map(d=>dayKcal(pid,d));
  const burnV=logged.map(d=>dayBurn(pid,d));
  const avgIn=inV.length?inV.reduce((a,b)=>a+b,0)/inV.length:0;
  const avgBurn=burnV.length?burnV.reduce((a,b)=>a+b,0)/burnV.length:0;
  const base=baseBudget(S.profiles[pid]);
  const onTarget=logged.filter(d=>dayKcal(pid,d)<=dayBudget(pid,d)).length;
  const dailyDeficit=(base+avgBurn)-avgIn;
  return {days:days,logged:logged.length,avgIn:avgIn,avgBurn:avgBurn,base:base,
          onTarget:onTarget,dailyDeficit:dailyDeficit,weeklyKg:dailyDeficit*7/KCAL_PER_KG};
}

/* ================= your usuals =================
   Most meals repeat. Anything eaten twice or more for this meal becomes a
   one-tap chip, so the common case stops being a search. */
function usuals(pid,meal,limit){
  const seen={};
  for(const d in S.logs[pid]){
    for(const e of S.logs[pid][d]){
      if(e.meal!==meal)continue;
      const k=e.name;
      if(!seen[k])seen[k]={n:0,item:e};
      seen[k].n++; seen[k].item=e;
    }
  }
  const today=entries(pid,S.date).filter(e=>e.meal===meal).map(e=>e.name);
  return Object.values(seen)
    .filter(x=>x.n>=2 && today.indexOf(x.item.name)<0)
    .sort((a,b)=>b.n-a.n).slice(0,limit)
    .map(x=>x.item);
}
function usualsHTML(meal){
  const list=usuals(S.me,meal,3);
  if(!list.length)return "";
  return '<div class="usuals">'+list.map(e=>
    '<button class="usual" data-act="usual" data-meal="'+meal+'" data-name="'+esc(e.name)+'">'+
      '<span>'+(e.ic||"🍽️")+'</span> '+esc(e.name)+' <b class="num">'+r0(e.kcal)+'</b></button>').join("")+'</div>';
}

/* ================= calorie banking =================
   A day over budget isn't a failure if the week balances. Only days that were
   actually logged count -- an unlogged day is unknown, not a surplus. */
function weekBank(pid){
  let net=0,days=0;
  for(const d of periodDays(7)){
    if(!anyLogged(pid,d))continue;
    days++; net+=dayBudget(pid,d)-dayKcal(pid,d);
  }
  return {net:net,days:days};
}
function bankLineHTML(pid){
  const b=weekBank(pid);
  if(b.days<2)return "";
  const under=b.net>=0;
  return '<div class="bank '+(under?"good":"over")+'">'+
    (under?'🏦 <b class="num">'+r0(b.net)+'</b> under budget for the week'
          :'⚖️ <b class="num">'+r0(-b.net)+'</b> over budget for the week')+
    '<span class="tiny muted"> · '+b.days+' logged days</span></div>';
}
/* ================= consistency =================
   One square per day: filled = logged and within budget, hollow-warm = logged
   but over, empty = nothing logged. Answers "are we actually keeping this up?"
   at a glance, with the numbers underneath for the detail. */
function dayStatus(pid,d){
  if(!anyLogged(pid,d))return "none";
  return dayKcal(pid,d)<=dayBudget(pid,d)?"on":"over";
}
function periodDays(n){
  const out=[];for(let i=n-1;i>=0;i--)out.push(addDays(todayStr(),-i));return out;
}
function consistency(pid,n){
  const days=periodDays(n), start=(S.journey&&S.journey.start)||days[0];
  /* days before the journey began aren't misses */
  const live=days.filter(d=>d>=start);
  let logged=0,on=0,best=0,run=0,eaten=[],burned=[];
  for(const d of live){
    const st=dayStatus(pid,d);
    if(st==="none"){run=0;continue;}
    logged++; eaten.push(dayKcal(pid,d)); burned.push(dayBurn(pid,d));
    if(st==="on"){on++;run++;best=Math.max(best,run);}else run=0;
  }
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  return {days:live,total:live.length,logged:logged,on:on,best:best,
    loggedPct:live.length?Math.round(logged/live.length*100):0,
    onPct:logged?Math.round(on/logged*100):0,
    avgIn:mean(eaten),avgBurn:mean(burned),streak:streak(pid)};
}
function dotGridHTML(pid,n){
  const days=periodDays(n), start=(S.journey&&S.journey.start)||days[0];
  return '<div class="dots">'+days.map(d=>{
    if(d<start)return '<i class="dot pre" title="'+niceDate(d)+' · before you started"></i>';
    const st=dayStatus(pid,d);
    const label={on:"on target",over:"over budget",none:"nothing logged"}[st];
    return '<i class="dot '+st+'" title="'+niceDate(d)+' · '+label+'"></i>';
  }).join("")+'</div>';
}

/* ================= the journey ================= */
function partnerOf(pid){return pid==="a"?"b":"a";}
function meProf(){return S.profiles[S.me];}
function themProf(){return S.profiles[partnerOf(S.me)];}
function journeyDay(){
  if(!S.journey||!S.journey.start)return 1;
  const a=new Date(S.journey.start).getTime(), b=new Date(todayStr()).getTime();
  return Math.max(1,Math.round((b-a)/86400000)+1);
}
function journeyStats(){
  const start=(S.journey&&S.journey.start)||todayStr();
  const days=[];
  for(let d=start;d<=todayStr();d=addDays(d,1)){days.push(d);if(days.length>400)break;}
  let bothLogged=0,bothOnTarget=0;
  for(const d of days){
    if(anyLogged("a",d)&&anyLogged("b",d)){
      bothLogged++;
      if(dayKcal("a",d)<=dayBudget("a",d)&&dayKcal("b",d)<=dayBudget("b",d))bothOnTarget++;
    }
  }
  let lost=0;
  for(const pid of ["a","b"]){
    const w=S.weights[pid];
    if(w&&w.length>=2)lost+=(w[0].kg-w[w.length-1].kg);
  }
  return {day:journeyDay(),days:days.length,bothLogged:bothLogged,bothOnTarget:bothOnTarget,lost:lost};
}
function milestones(){
  const st=journeyStats(), sa=streak("a"), sb=streak("b");
  return [
    {k:"Both logged a day together", done:st.bothLogged>=1},
    {k:"A week of the journey",      done:st.day>=7},
    {k:"5 days both on target",      done:st.bothOnTarget>=5},
    {k:"7-day streak each",          done:sa>=7&&sb>=7},
    {k:"1 kg gone between you",      done:st.lost>=1},
    {k:"5 kg gone between you",      done:st.lost>=5}
  ];
}

/* photo: downscale to a small square so it fits comfortably in local storage */
function pickPhoto(pid,done){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{
    const file=inp.files&&inp.files[0]; if(!file)return;
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const SZ=180, cv=document.createElement("canvas");
        cv.width=SZ; cv.height=SZ;
        const ctx=cv.getContext("2d");
        const m=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,SZ,SZ);
        try{ S.profiles[pid].photo=cv.toDataURL("image/jpeg",0.8); }
        catch(e){ alert("That image couldn't be read. Try another one."); return; }
        persist();
        if(done)done(); else render();
      };
      img.onerror=()=>alert("That file doesn't look like an image.");
      img.src=fr.result;
    };
    fr.onerror=()=>alert("Couldn't read that file.");
    fr.readAsDataURL(file);
  };
  inp.click();
}

async function downloadBackup(){
  const json=await backupJSONWithPhotos(), fn=backupName();
  if(window.claude&&typeof claude.use==="function"){
    try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:fn,data:json});S.backedUpAt=Date.now();persist();return true;}}catch(e){}
  }
  try{
    const b=new Blob([json],{type:"application/json"});const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    S.backedUpAt=Date.now();persist();
    return true;
  }catch(e){return false;}
}

function mergeFrom(st,opts){
  opts=opts||{};
  migrate(st);
  for(const pid of ["a","b"]){
    for(const key of ["logs","ex"]){
      const incoming=st[key][pid]||{};
      for(const d in incoming){
        const cur=S[key][pid][d]||(S[key][pid][d]=[]);
        for(const e of incoming[d]){if(!cur.some(x=>x.id===e.id))cur.push(e);}
      }
    }
    const inW=st.water[pid]||{};
    for(const d in inW)S.water[pid][d]=Math.max(S.water[pid][d]||0,inW[d]);
    const seen={};for(const w of S.weights[pid])seen[w.d]=w;
    for(const w of st.weights[pid]||[]){if(!seen[w.d])S.weights[pid].push(w);}
    S.weights[pid].sort((x,y)=>x.d<y.d?-1:1);
    for(const nm of (st.favs&&st.favs[pid])||[]){if(S.favs[pid].indexOf(nm)<0)S.favs[pid].push(nm);}
  }
  /* each phone owns its own profile; the other one comes from them */
  if(opts.profiles!==false){
    const them=partnerOf(S.me);
    if(st.profiles[them]&&st.profiles[them].name)
      S.profiles[them]=Object.assign({},st.profiles[them],{id:them});
  }
  for(const c of st.custom||[]){if(!S.custom.some(x=>x.name===c.name))S.custom.push(c);}
  for(const m of st.savedMeals||[]){if(!S.savedMeals.some(x=>x.id===m.id))S.savedMeals.push(m);}
  if(st.journey&&st.journey.start){
    if(!S.journey.start||st.journey.start<S.journey.start)S.journey.start=st.journey.start;
  }
}

function applyInvite(raw){
  let obj;
  try{obj=JSON.parse(raw);}catch(e){return {ok:false,msg:"That doesn\u2019t look like an invite code."};}
  const st=obj.state||obj;
  if(!st||!st.profiles||!st.logs)return {ok:false,msg:"That isn\u2019t a Two Spoons invite."};
  migrate(st);
  const theirs=st.me||"a", mine=partnerOf(theirs);
  S.me=mine;S.active=mine;
  S.profiles[theirs]=Object.assign({},st.profiles[theirs],{id:theirs});
  S.journey.start=(st.journey&&st.journey.start)||todayStr();
  mergeFrom(st,{profiles:false});
  S.paired=true;persist();
  return {ok:true};
}

/* ================= automatic sync =================
   A tiny relay of your own holds two blobs — one per phone — and the meal photos.
   Everything is encrypted here, on the phone, before it goes anywhere: the relay
   stores bytes it has no way to read. The key lives only on your two devices and
   travels once, inside the invite.

   Each phone writes only its own slot and reads only the other's, so the two can
   never overwrite each other and there is nothing to resolve. */
/* Reads are cheap (100k/day) so we can look often; writes are the scarce one
   (1k/day) and only happen when something actually changed. */
function b64bytes(str){
  const bin=atob(str), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return u;
}
const SYNC_PULL_MS=15000, SYNC_PUSH_DEBOUNCE=6000;
let syncTimer=null, syncPushTimer=null, syncBusy=false, lastPushed="";

function syncReady(){
  return !!(S.sync&&S.sync.url&&S.sync.room&&S.sync.key&&window.crypto&&crypto.subtle);
}
function newSyncCreds(){
  const r=new Uint8Array(16), k=new Uint8Array(32);
  crypto.getRandomValues(r); crypto.getRandomValues(k);
  return {url:"",room:hexOf(r),key:bytesB64(k),on:true};
}
function hexOf(u8){ return [...u8].map(b=>b.toString(16).padStart(2,"0")).join(""); }
function bytesB64(u8){ let s="";for(const b of u8)s+=String.fromCharCode(b);return btoa(s); }
async function syncCryptoKey(){
  return crypto.subtle.importKey("raw",b64bytes(S.sync.key),{name:"AES-GCM"},false,["encrypt","decrypt"]);
}
async function syncSeal(text){
  const key=await syncCryptoKey(), iv=new Uint8Array(12);
  crypto.getRandomValues(iv);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(text));
  return JSON.stringify({iv:bytesB64(iv),data:bytesB64(new Uint8Array(ct))});
}
async function syncOpen(text){
  const blob=JSON.parse(text), key=await syncCryptoKey();
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64bytes(blob.iv)},key,b64bytes(blob.data));
  return new TextDecoder().decode(pt);
}
function syncURL(kind,id){
  return S.sync.url.replace(/\/+$/,"")+"/"+kind+"/"+S.sync.room+"/"+encodeURIComponent(id);
}
async function syncFetch(url,opts){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),15000);
  try{ return await fetch(url,Object.assign({signal:c.signal,cache:"no-store"},opts||{})); }
  finally{ clearTimeout(t); }
}
/* what this phone puts up: its own view of everything, plus which photos it holds */
async function syncPush(){
  const mine=[];
  for(const pid of ["a","b"])
    for(const d in (S.logs[pid]||{}))
      for(const e of S.logs[pid][d]) if(e.photo) mine.push(e.id);
  /* Compare only what a partner would actually notice. The saved state also carries
     bookkeeping — when it was last touched, last synced — which changes on every save,
     so comparing the whole thing would upload on every pass and burn the write budget
     for nothing. */
  const sig=JSON.stringify({logs:S.logs,ex:S.ex,water:S.water,weights:S.weights,
    profiles:S.profiles,custom:S.custom,savedMeals:S.savedMeals,favs:S.favs,
    journey:S.journey,photos:mine});
  if(sig===lastPushed) return {skipped:true};
  const payload=JSON.stringify({v:1,who:S.me,at:Date.now(),state:exportableState(),photos:mine});
  const r=await syncFetch(syncURL("s",S.me),{method:"PUT",body:await syncSeal(payload)});
  if(!r.ok) throw new Error("upload refused ("+r.status+")");
  lastPushed=sig;

  /* photos are written once and never change, so only the new ones go up */
  S.sync.up=S.sync.up||{};
  for(const id of mine){
    if(S.sync.up[id])continue;
    let data=photoCache[id];
    if(data===undefined){ try{ data=await PhotoStore.get(id); }catch(e){ data=null; } }
    if(!data)continue;
    try{
      const pr=await syncFetch(syncURL("p",id),{method:"PUT",body:await syncSeal(data)});
      if(pr.ok)S.sync.up[id]=1;
    }catch(e){}
  }
  return {pushed:true};
}
async function syncPull(){
  const them=partnerOf(S.me);
  const r=await syncFetch(syncURL("s",them));
  if(r.status===404) return {none:true};
  if(!r.ok) throw new Error("download refused ("+r.status+")");
  let obj;
  try{ obj=JSON.parse(await syncOpen(await r.text())); }
  catch(e){ throw new Error("badkey"); }
  if(!obj||!obj.state) return {none:true};

  /* Only worth repainting if their side really moved — otherwise a quiet poll
     would rebuild the screen every few seconds under the user's fingers. */
  const shot=()=>JSON.stringify({logs:S.logs,ex:S.ex,water:S.water,
    weights:S.weights,profiles:S.profiles,journey:S.journey});
  const was=shot();
  mergeFrom(obj.state);
  S.paired=true;
  const changed=(was!==shot());

  let got=0;
  for(const id of (obj.photos||[])){
    if(photoCache[id])continue;
    let have=null;
    try{ have=await PhotoStore.get(id); }catch(e){}
    if(have){ photoCache[id]=have; continue; }
    if(!findEntry(id))continue;              /* only photos for entries we now hold */
    try{
      const pr=await syncFetch(syncURL("p",id));
      if(!pr.ok)continue;
      const data=await syncOpen(await pr.text());
      if(typeof data==="string"&&data.indexOf("data:image/")===0){
        await PhotoStore.put(id,data); photoCache[id]=data;
        const ent=findEntry(id); if(ent)ent.photo=1;
        got++;
      }
    }catch(e){}
  }
  return {merged:true,photos:got,at:obj.at||0,changed:changed||got>0};
}
async function syncNow(quiet){
  if(!syncReady()||S.sync.on===false||syncBusy)return null;
  syncBusy=true;
  const before=S.sync.err;
  try{
    await syncPush();
    const res=await syncPull();
    S.sync.err=""; S.sync.at=Date.now();
    if(res&&res.at)S.sync.theirAt=res.at;
    persist();
    /* their new entries should simply appear, without anyone tapping anything */
    if(!quiet||before||(res&&res.changed))render();
    else paintPhotos();
    return res;
  }catch(e){
    S.sync.err=(e&&e.message==="badkey")
      ? "The other phone is using a different invite — send a fresh one."
      : (navigator.onLine===false ? "Offline. It'll catch up." : "Couldn't reach your sync relay.");
    persist();
    if(!quiet)render();
    return null;
  }finally{ syncBusy=false; }
}
function syncSoon(){                      /* something changed: push shortly */
  if(!syncReady()||S.sync.on===false)return;
  clearTimeout(syncPushTimer);
  syncPushTimer=setTimeout(()=>syncNow(true),SYNC_PUSH_DEBOUNCE);
}
function syncStart(){
  clearInterval(syncTimer);
  if(!syncReady()||S.sync.on===false)return;
  syncTimer=setInterval(()=>{ if(!document.hidden)syncNow(true); },SYNC_PULL_MS);
  syncNow(true);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden)syncNow(true); });
window.addEventListener("online",()=>syncNow(true));
function syncAgeLabel(ts){
  if(!ts)return "not yet";
  const s=Math.round((Date.now()-ts)/1000);
  if(s<60)return "just now";
  if(s<3600)return Math.round(s/60)+" min ago";
  if(s<86400)return Math.round(s/3600)+" h ago";
  return Math.round(s/86400)+" days ago";
}

/* ---- joining by link ----
   Pasting a screenful of JSON is the least seamless thing left in setup. A link
   carries the same three facts — which relay, which room, which key — in a form
   you can tap. It lives in the URL's fragment, after the #, which browsers never
   send to the server: GitHub Pages sees a plain page request and nothing else. */
function b64url(str){ return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64url(str){
  str=String(str).replace(/-/g,"+").replace(/_/g,"/");
  while(str.length%4)str+="=";
  return atob(str);
}
function joinLink(){
  if(!(S.sync&&S.sync.room&&S.sync.key&&S.sync.url))return "";
  return location.origin+location.pathname+"#j="+
    S.sync.room+"~"+b64url(S.sync.key)+"~"+b64url(S.sync.url);
}
function readJoinLink(){
  const m=(location.hash||"").match(/^#j=([a-f0-9]{16,64})~([A-Za-z0-9_-]+)~([A-Za-z0-9_-]+)$/);
  if(!m)return null;
  try{
    const creds={room:m[1],key:unb64url(m[2]),url:unb64url(m[3])};
    if(!/^https?:\/\//.test(creds.url))return null;
    return creds;
  }catch(e){ return null; }
}
function clearHash(){
  try{ history.replaceState(null,"",location.origin+location.pathname+location.search); }
  catch(e){ location.hash=""; }
}
/* Tapping an invite link while the app is already open changes only the fragment,
   which does not reload the page — so listen for that too. */
window.addEventListener("hashchange",()=>{
  if(consumeJoinLink()){ render(); syncStart(); syncNow(false); }
});
/* Called at boot, before the first render, so the link decides where setup starts. */
function consumeJoinLink(){
  const creds=readJoinLink();
  if(!creds)return false;
  clearHash();
  S.sync=Object.assign({},creds,{up:{},err:"",at:0,theirAt:0,on:true});
  S.paired=true;
  if(!S.setup){                       /* brand new phone: they are the joiner */
    S.me="b"; S.active="b"; S.setupStep="you"; S.joinedByLink=true;
  }
  persist();
  return true;
}

/* ================= boot ================= */
(async function boot(){
  await Store.init();
  const saved=await Store.load();
  if(saved&&saved.profiles&&saved.logs)S=migrate(saved);
  S.tab="today"; S.date=todayStr();
  const joined=consumeJoinLink();
  await PhotoStore.open();
  render();
  if(joined)syncNow(false);
  prunePhotos().then(n=>{ if(n)paintPhotos(); }).catch(()=>{});
  syncStart();
})();
</script>
