name: Garmin sync

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 min; GitHub often runs a few min late
  workflow_dispatch:             # and a "Run workflow" button for on-demand syncs

concurrency:
  group: garmin-sync
  cancel-in-progress: false

permissions:
  contents: write                # needed to commit garmin.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet garminconnect cryptography

      - name: Fetch activities
        env:
          GARMIN_TOKENS_A: ${{ secrets.GARMIN_TOKENS_A }}
          GARMIN_EMAIL_A: ${{ secrets.GARMIN_EMAIL_A }}
          GARMIN_PASSWORD_A: ${{ secrets.GARMIN_PASSWORD_A }}
          GARMIN_TOKENS_B: ${{ secrets.GARMIN_TOKENS_B }}
          GARMIN_EMAIL_B: ${{ secrets.GARMIN_EMAIL_B }}
          GARMIN_PASSWORD_B: ${{ secrets.GARMIN_PASSWORD_B }}
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
        run: python scripts/garmin_sync.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- garmin.json; then
            echo "No change since the last sync."
            exit 0
          fi
          git config user.name  "garmin-sync"
          git config user.email "garmin-sync@users.noreply.github.com"
          git add garmin.json
          git commit -m "Garmin sync $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
